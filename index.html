body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:18px;margin:0}
.role{display:flex;gap:6px}

.role button.on{background:var(--pri);color:#fff}
main{padding:0 16px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
form,.f{display:flex;flex-wrap:wrap;gap:8px}
input,select{flex:1 1 120px;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.btn{flex:1 1 100%;border:0;background:var(--pri);color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:700}
.btn:disabled{opacity:.4}
.sm{flex:0 0 auto;border:1px solid var(--bd);background:var(--chip);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:600}
.dk{background:#1E3A5F;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row b{text-transform:capitalize}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;color:var(--ok);font-size:16px;flex:0 0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font:inherit;font-size:12px;font-weight:700}
nav button.on{color:var(--pri)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:5px 0}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%}
.chip{border:0;white-space:nowrap;background:var(--chip);color:var(--mut);padding:6px 12px;border-radius:99px;font:inherit;font-size:12px;font-weight:700}
.chip.on{background:var(--pri);color:#fff}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:190px;overflow-y:auto;flex:1 1 100%}
.it{text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px;border-radius:10px;font:inherit;font-size:13px;text-transform:capitalize}
.it.on{border-color:var(--pri);background:var(--chip)}
.it small{color:var(--mut)}
.qd{display:flex;gap:6px;align-items:center}.qd input{width:64px;flex:none;padding:8px}
.step{display:flex;align-items:center;gap:10px;flex:1 1 100%}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;flex-direction:column;gap:10px;padding:16px;align-items:center;overflow:auto}
#ov img{max-width:100%;border-radius:12px}
@media print{header,nav,.np{display:none!important}}
.auto{outline:2px solid #f59e0b;background:rgba(245,158,11,.14)}
#lblprint{display:none}.lbl{width:62mm;max-width:100%;border:1px solid #000;border-radius:4px;padding:2mm;font:11px/1.3 system-ui,sans-serif;color:#000;background:#fff;margin-bottom:6px}
@media print{body.pl>*:not(#lblprint){display:none!important}body.pl #lblprint{display:block!important}.lbl{page-break-after:always;margin:0}}
#t{position:fixed;left:16px;right:16px;bottom:84px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;display:none;z-index:30;text-align:center}
</style>
</head>
<body>
<header><h1 style="display:flex;align-items:center;gap:8px"><span style="width:32px;height:32px;display:block"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chef Control"><rect width="512" height="512" rx="112" fill="#1E3A5F"/><g transform="translate(0,25)"><circle cx="180" cy="200" r="58" fill="#fff"/><circle cx="256" cy="168" r="70" fill="#fff"/><circle cx="332" cy="200" r="58" fill="#fff"/><rect x="150" y="258" width="212" height="10" fill="#1E3A5F"/><rect x="176" y="268" width="160" height="96" rx="14" fill="#fff"/><path d="M214 316 L244 344 L298 288" fill="none" stroke="#F26B21" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g></svg></span><span><span style="color:var(--pri)">Chef</span> <span style="color:var(--blue)">Control</span></span></h1><div class="role" id="role"></div></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="lblprint"></div><div id="ov"></div><div id="t"></div>
<div id="md" class="hidden fixed inset-0 z-40 items-end sm:items-center justify-center bg-black/60 p-3"></div>
<script>
const CAT='alimentare|farina 00:kg,farina manitoba:kg,semola rimacinata:kg,zucchero:kg,sale fino:kg,sale grosso:kg,olio extravergine:l,olio di semi:l,aceto:l,pomodori pelati:conf,passata di pomodoro:conf,pomodori freschi:kg,mozzarella:kg,fiordilatte:kg,parmigiano:kg,pecorino:kg,ricotta:kg,gorgonzola:kg,mascarpone:kg,burro:kg,latte:l,panna:l,uova:pz,lievito di birra:pz,pasta:kg,riso:kg,patate:kg,cipolle:kg,aglio:kg,insalata:kg,limoni:kg,funghi:kg,melanzane:kg,zucchine:kg,peperoni:kg,prosciutto cotto:kg,prosciutto crudo:kg,salame:kg,pancetta:kg,guanciale:kg,pollo:kg,carne macinata:kg,pesce fresco:kg,gamberi:kg,calamari:kg,vongole:kg,tonno in scatola:conf,capperi:conf,olive:conf,basilico:conf,prezzemolo:conf,pepe:conf,origano:conf,cioccolato:kg,savoiardi:conf,miele:kg,caffè:kg,acqua naturale:conf,acqua frizzante:conf,birra:conf,vino bianco:l,vino rosso:l;cucina|carta da forno:conf,pellicola trasparente:pz,carta alluminio:pz,carta assorbente:conf,tovaglioli:conf,guanti monouso:conf,sacchetti sottovuoto:conf,sacchi spazzatura:conf,vaschette asporto:conf,scatole pizza:conf,bicchieri monouso:conf,stuzzicadenti:conf,etichette lotto:pz,retine per capelli:conf,bombola gas:pz;pulizia|detersivo piatti:l,sgrassatore:l,sanificante:l,candeggina:l,spugne:conf,panni microfibra:conf,sapone mani:l,carta igienica:conf';
const CATALOG=[];CAT.split(';').forEach(g=>{const[c,l]=g.split('|');l.split(',').forEach(x=>{const[n,u]=x.split(':');CATALOG.push({n,u,c})})});
const K='ristoapp-v2';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({role:'dip',tab:'spesa',spesa:[],lotti:[],fatture:[],acconti:[],barcodes:{},custom:[],ricette:[],prezzi:{},mov:[],al:{},target:30,iva:10,storico:{},cats:['Alimentari Freschi','Bibite & Beverage','Detersivi & Sanitari'],inc:[],chk:{d:'',ids:[]},gg:30,soglia:5,nd:'',who:'',log:[],units:[{id:'u1',n:'Frigo 1',max:4,min:null},{id:'u2',n:'Congelatore 1',max:-18,min:null}],temps:[],ctasks:[{id:'c1',n:'Sanificazione piani di lavoro'},{id:'c2',n:'Pulizia affettatrice'},{id:'c3',n:'Pulizia forni e piastre'},{id:'c4',n:'Pulizia interno frigoriferi'},{id:'c5',n:'Sanificazione taglieri e coltelli'},{id:'c6',n:'Lavaggio pavimenti cucina'},{id:'c7',n:'Pulizia servizi igienici'},{id:'c8',n:'Lavaggio contenitori rifiuti'}],clog:[],sprechi:[],costi:[],msgs:[],notes:[]},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const today=()=>new Date().toISOString().slice(0,10);
const fd=s=>new Date(s+'T12:00:00').toLocaleDateString('it-IT');
const all=()=>CATALOG.concat(S.custom);
const find=n=>all().find(i=>i.n===n);
const P={s:{q:'',cat:'',sel:null,qty:1},l:{q:'',cat:'',sel:null}};
const M={L:{},F:{mode:'in_debito'},A:{}};
const FILE={};let stream=null;

// ---- foto in IndexedDB (archivio) ----
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ristoapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
async function phPut(k,b){try{const d=await idb();d.transaction('ph','readwrite').objectStore('ph').put(b,k);return true}catch(e){return false}}
async function phGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('ph').objectStore('ph').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function shrink(f){try{const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.8))}catch(e){return f}}
function toast(m){const t=document.getElementById('t');t.textContent=m;t.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display='none',3200)}

function addSpesa(name,qty,unit){
  name=name.trim().toLowerCase();
  const ex=S.spesa.find(i=>i.name===name&&!i.done);
  if(ex)ex.qty=+(ex.qty+qty).toFixed(2);
  else S.spesa.unshift({id:uid(),name,qty,unit,done:false,by:S.role==='tit'?'Titolare':'Dipendente'});
}

// ---- selettore catalogo ----
function grid(c){const p=P[c],q=p.q.trim().toLowerCase();const l=all().filter(i=>(!p.cat||i.c===p.cat)&&i.n.includes(q));
  return l.map(i=>`<button type="button" class="it ${p.sel===i.n?'on':''}" data-a="sel" data-c="${c}" data-id="${esc(i.n)}">${esc(i.n)} <small>${i.u}</small></button>`).join('')+(q&&!all().some(i=>i.n===q)?`<button type="button" class="it" data-a="newit" data-c="${c}" data-id="${esc(q)}">➕ Aggiungi “${esc(q)}”</button>`:'')}
function picker(c){const p=P[c];return `<input data-pq="${c}" value="${esc(p.q)}" placeholder="🔍 Cerca nel catalogo…" style="flex:1 1 100%"><div class="chips">${[['','Tutti'],['alimentare','🍅 Alimenti'],['cucina','🧻 Cucina'],['pulizia','🧽 Pulizia']].map(([k,l])=>`<button type="button" class="chip ${p.cat===k?'on':''}" data-a="cat" data-c="${c}" data-id="${k}">${l}</button>`).join('')}</div><div class="cgrid" id="g-${c}">${grid(c)}</div>`}
const bv=(o,k,d='')=>esc(M[o][k]??d);

function vSpesa(){
  const open=S.spesa.filter(i=>!i.done),done=S.spesa.filter(i=>i.done),it=P.s.sel&&find(P.s.sel);
  let h=`<div class="card"><h2>➕ Manca qualcosa? Tocca per scegliere</h2><div class="f">${picker('s')}
  ${it?`<div class="step"><b style="flex:1;text-transform:capitalize">${esc(it.n)}</b><button class="sm" data-a="qm">−</button><b>${P.s.qty} ${it.u}</b><button class="sm" data-a="qp">+</button></div>`:''}
  <button class="btn" data-a="addsp" ${it?'':'disabled'}>Aggiungi in lista</button></div></div>
  <div class="card"><h2>Lista in tempo reale · ${open.length} articoli</h2>`;
  h+=open.length?open.map(i=>`<div class="row"><div><b>${esc(i.name)}</b><div class="mut">${i.qty} ${esc(i.unit)} · ${i.by}</div></div><button class="chk" data-a="tg" data-id="${i.id}">○</button></div>`).join(''):'<div class="empty">Niente da comprare 🎉</div>';
  h+='</div>';
  if(S.role==='tit')h+=`<div class="card"><h2>📋 Lista definitiva</h2><button class="sm" data-a="cp">Copia lista</button> ${done.length?`<button class="sm" data-a="cl">Svuota presi (${done.length})</button>`:''}</div>`;
  if(done.length)h+=`<div class="card"><h2>Presi</h2>${done.map(i=>`<div class="row"><div><b style="text-decoration:line-through;color:var(--mut)">${esc(i.name)}</b> <span class="mut">${i.qty} ${esc(i.unit)}</span></div><button class="chk" data-a="tg" data-id="${i.id}">✓</button></div>`).join('')}</div>`;
  return h;
}

function vLotti(){
  const sups=[...new Set(S.fatture.map(f=>f.sup).concat(S.lotti.map(l=>l.sup)))].filter(Boolean),it=P.l.sel&&find(P.l.sel);
  let h=`<div class="card"><h2>🏷️ Etichette lotto</h2><div class="f"><button class="sm dk" data-a="scan" data-id="cerca" style="flex:1"><i class="fa-solid fa-barcode"></i> Scansiona etichetta</button><button class="sm" data-a="etm" style="flex:1"><i class="fa-solid fa-utensils"></i> Etichetta prodotto preparato</button></div></div><div class="card"><h2>📥 Arrivo merce</h2><div class="f">
  <button class="sm dk" data-a="scan" style="flex:1">📷 Scansiona codice</button><button class="sm" data-a="pick" data-id="lf" style="flex:1">🖼️ Foto etichetta</button>
  <input type="file" id="lf" accept="image/*" capture="environment" hidden data-fi="L">
  ${FILE.L?'<span class="mut" style="flex:1 1 100%">📎 foto allegata</span>':''}
  ${it?`<b style="flex:1 1 100%;text-transform:capitalize" class="ok">✓ ${esc(it.n)} (${it.u}) <button class="sm" data-a="unsel">cambia</button></b>`:picker('l')}
  </div><form data-f="lotto" style="margin-top:8px">
  <input data-b="L.lot" value="${bv('L','lot')}" placeholder="N° lotto" required>
  <input data-b="L.exp" type="date" value="${bv('L','exp')}" required title="Scadenza">
  <input data-b="L.qty" type="number" step="0.1" min="0.1" value="${bv('L','qty')}" placeholder="Q.tà ${it?it.u:''}" required style="flex:0 0 100px">
  <input data-b="L.sup" list="sl" value="${bv('L','sup')}" placeholder="Fornitore"><datalist id="sl">${sups.map(s=>`<option>${esc(s)}</option>`).join('')}</datalist>
  <button class="btn">Registra lotto</button></form></div>`;
  const act=S.lotti.filter(l=>l.rem>0).sort((a,b)=>(a.exp||'9').localeCompare(b.exp||'9')),old=S.lotti.filter(l=>l.rem<=0);
  h+=`<div class="card"><h2>Lotti attivi (prima scadenza in alto)</h2>`;
  h+=act.length?act.map(l=>{const d=l.exp?Math.round((new Date(l.exp+'T12:00:00')-new Date())/864e5):999,c=d<0?'bad':d<=3?'warn':'ok',t=d<0?'Scaduto':d<=3?`Scade tra ${d} g`:'OK';
    return `<div class="row" style="flex-wrap:wrap"><div><b>${esc(l.name)}</b> <span class="tag ${c}">${t}</span><div class="mut">Lotto ${esc(l.lot)} · ${l.exp?'scad. '+fd(l.exp):'senza scadenza'}${l.sup?' · '+esc(l.sup):''}${l.ph?` · <a href="#" data-a="ph" data-id="${l.id}">foto</a>`:''}</div><b style="text-transform:none">${l.rem}</b> / ${l.qty} ${esc(l.unit)}</div>
    <div class="qd"><input type="number" step="0.1" min="0.1" placeholder="Q.tà" id="q${l.id}"><button class="sm" data-a="sc" data-id="${l.id}">Scarica</button><button class="sm" data-a="ex" data-id="${l.id}">Finito</button><button class="sm" data-a="lbl" data-id="${l.id}" title="Etichetta"><i class="fa-solid fa-tag"></i></button></div></div>`}).join(''):'<div class="empty">Nessun lotto in magazzino</div>';
  h+='</div>';
  if(old.length)h+=`<div class="card"><h2>Storico lotti esauriti</h2>${old.slice(0,20).map(l=>`<div class="row"><div><b>${esc(l.name)}</b><div class="mut">Lotto ${esc(l.lot)} · ${l.qty} ${esc(l.unit)}${l.sup?' · '+esc(l.sup):''}</div></div><span class="tag">Esaurito</span></div>`).join('')}</div>`;
  return h;
}

const paid=f=>f.pays.reduce((a,p)=>a+p.amt,0);
const st=f=>{const p=paid(f);return p>=f.amt-.001?'pagato':p>0?'parziale':'in_debito'};
const LB={pagato:['Pagato','ok'],parziale:['Pagato in parte','warn'],in_debito:['In debito','bad']};

// ===== NUOVE SEZIONI: ricette/food cost, allergeni, consumi, XML =====
const ld=()=>new Date().toLocaleDateString('sv-SE');
const pr=n=>(S.prezzi[n]||{}).p||0;
let SUG=[];
P.r={q:'',cat:'',sel:null};P.a={q:'',cat:'',sel:null};P.o=null;P.c=null;M.R={};
const AL=['Glutine','Crostacei','Uova','Pesce','Arachidi','Soia','Latte','Frutta a guscio','Sedano','Senape','Sesamo','Solfiti','Lupini','Molluschi'];
const ALI=['🌾','🦐','🥚','🐟','🥜','🫘','🥛','🌰','🥬','🟡','⚪','🍷','🌼','🐚'];
const PRE={0:'farina 00,farina manitoba,semola rimacinata,pasta,savoiardi,birra',1:'gamberi',2:'uova,savoiardi',3:'pesce fresco,tonno in scatola',6:'mozzarella,fiordilatte,parmigiano,pecorino,ricotta,gorgonzola,mascarpone,burro,latte,panna',11:'vino bianco,vino rosso,aceto',13:'calamari,vongole'};
const alOf=n=>{if(S.al[n])return S.al[n];const o={};Object.entries(PRE).forEach(([k,v])=>{if(v.split(',').includes(n))o[k]='c'});return o};
const rAl=r=>{const o={};r.items.forEach(i=>Object.entries(alOf(i.n)).forEach(([k,v])=>{if(v==='c'||!o[k])o[k]=v}));return o};
const rCost=r=>r.items.reduce((a,i)=>a+i.q*pr(i.n),0)/Math.max(r.por,1);
const rMiss=r=>r.items.filter(i=>!(pr(i.n)>0)).length;
const rnd=x=>Math.ceil(x*2)/2;

function vRicette(){
  const net=p=>p/(1+S.iva/100);
  let h=`<div class="card"><h2>🍕 Food cost</h2><div class="f"><label class="mut" style="flex:1">Obiettivo %<input data-g="target" type="number" value="${S.target}"></label><label class="mut" style="flex:1">IVA vendite %<input data-g="iva" type="number" value="${S.iva}"></label></div><p class="mut">I costi usano l’ultimo prezzo di ogni ingrediente (IVA esclusa): arriva dalle fatture XML oppure lo scrivi a mano dentro il piatto.</p></div>
  <div class="card"><h2>Nuovo piatto</h2><form data-f="ric"><input data-b="R.n" value="${bv('R','n')}" placeholder="Es. pizza margherita" required><input data-b="R.p" type="number" step="0.01" value="${bv('R','p')}" placeholder="Prezzo attuale € (IVA incl.)"><input data-b="R.por" type="number" step="0.5" min="0.5" value="${bv('R','por','1')}" placeholder="Porzioni" style="flex:0 0 90px"><button class="btn">Crea piatto</button></form></div>`;
  S.ricette.forEach(r=>{
    const c=rCost(r),f=r.price>0?c/net(r.price)*100:null,mi=rMiss(r),a=rAl(r),open=P.o===r.id;
    h+=`<div class="card"><div class="row" style="border:0;padding:0" data-a="ro" data-id="${r.id}"><div><b>${esc(r.n)}</b><div class="mut">costo a porzione ${eur(c)} · vendita ${r.price?eur(r.price):'—'}</div></div><span class="tag ${f==null?'':f<=S.target?'ok':f<=S.target+5?'warn':'bad'}">${f==null?'food cost —':'food cost '+f.toFixed(0)+'%'}</span></div>`;
    if(r.price>0&&c>0)h+=`<div class="mut">Margine lordo: <b>${eur(net(r.price)-c)}</b> a porzione (${(100-f).toFixed(0)}% del prezzo netto)</div>`;
    if(f!=null&&wasteRate()>0)h+=`<div class="mut">Food cost reale con sprechi: <b>${(f*(1+wasteRate())).toFixed(0)}%</b> (sprechi = ${(wasteRate()*100).toFixed(1)}% degli acquisti)</div>`;
    if(c>0)h+=`<div style="margin-top:4px">Prezzo consigliato al ${S.target}%: <b>${eur(rnd(c/(S.target/100)*(1+S.iva/100)))}</b></div>`;
    if(mi)h+=`<div class="warn mut">⚠️ ${mi} ingredienti senza prezzo: il costo è sottostimato</div>`;
    const al=Object.keys(a).map(i=>ALI[i]+' '+AL[i]+(a[i]==='t'?' (tracce)':''));
    if(al.length)h+=`<div class="mut">Allergeni: ${al.join(' · ')}</div>`;
    if(open){
      h+=r.items.map((i,k)=>`<div class="row"><div><b>${esc(i.n)}</b> <span class="mut">${i.q} ${esc(i.u)}</span></div><div class="qd"><input type="number" step="0.01" data-pr="${esc(i.n)}" value="${pr(i.n)||''}" placeholder="€/${esc(i.u)}"><button class="sm" data-a="ri" data-id="${r.id}" data-k="${k}">✕</button></div></div>`).join('');

// ===== LETTURA AUTOMATICA: parser del testo OCR =====
const pnum=s=>parseFloat(String(s).replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));
const isoD=(d,m,y)=>{d=+d;m=+m;y=+y;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2000)return '';return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
function parseFattText(t){
  const L=t.split(/\n/).map(x=>x.replace(/[ \t]+/g,' ').trim()).filter(Boolean),o={sup:'',num:'',amt:'',date:'',lines:[]};
  const fl=L.find(l=>/fattura/i.test(l)&&/\d/.test(l));
  if(fl){const m=fl.match(/\b(?:n\.?|nr\.?|n°|numero)\s*[:.]?\s*([A-Z]{0,4}[-\/]?\d[\w\/\-.]*)/i)||fl.match(/fattura\D{0,20}?(\d[\w\/\-.]*)/i);if(m)o.num=m[1].replace(/[.\-]+$/,'')}
  const dl=L.find(l=>/data/i.test(l)&&/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(l))||L.find(l=>/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(l));
  if(dl){const m=dl.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);o.date=isoD(m[1],m[2],m[3])}
  const nums=l=>(l.match(/\d[\d.]*(?:,\d+)?/g)||[]).map(pnum).filter(x=>x>0);
  for(const re of [/totale|da pagare/i,/importo/i]){const v=L.filter(l=>re.test(l)).flatMap(nums);if(v.length){o.amt=String(Math.max(...v));break}}
  const sl=L.find(l=>/\b(?:s\.?\s?r\.?\s?l\.?s?|s\.?\s?p\.?\s?a\.?|s\.?\s?n\.?\s?c\.?|s\.?\s?a\.?\s?s\.?|ditta|soc\.?\s*coop)(?=[\s.,]|$)/i.test(l))||L.find(l=>/[A-Za-zÀ-ú]{4}/.test(l)&&!/fattura|cliente|destinatario|data/i.test(l));
  if(sl)o.sup=sl.replace(/[,;|]+$/,'').trim();
  L.forEach(l=>{
    const toks=[...l.matchAll(/\d[\d.]*(?:,\d+)?/g)].map(m=>({v:pnum(m[0]),i:m.index}));
    for(let a=0;a<toks.length;a++)for(let b=a+1;b<toks.length;b++)for(let c=b+1;c<toks.length;c++){
      const q=toks[a].v,p=toks[b].v,tt=toks[c].v;
      if(q>0&&p>0&&tt>0&&Math.abs(q*p-tt)<=Math.max(.02,tt*.005)){
        const d=l.slice(0,toks[a].i).trim();
        if(/[A-Za-zÀ-ú]{3}/.test(d)&&!o.lines.some(x=>x.d===d)){o.lines.push({d,q:String(q),p:String(p)});return}
      }}
  });
  return o;
}
function parseLotText(t){
  const T=t.replace(/[ \t]+/g,' '),o={lot:'',exp:''};
  const m=T.match(/\b(?:lotto|lot)\b(?:\s*(?:n\.?|nr\.?|n°))?\s*[:.#-]*\s*([A-Z0-9][A-Z0-9\/\-.]{2,19})/i)||T.match(/\bL\s*:\s*([A-Z0-9][A-Z0-9\/\-.]{2,19})/);
  if(m&&/\d/.test(m[1]))o.lot=m[1].replace(/[.\-]+$/,'');
  const k='(?:scad\\w*|consumarsi|entro|exp\\w*|best before|tmc|da consumare)';
  let e=T.match(new RegExp(k+'[^\\d]{0,40}(\\d{1,2})[\\/.\\-\\s](\\d{1,2})[\\/.\\-\\s](\\d{2,4})','i'));
  if(e)o.exp=isoD(e[1],e[2],e[3]);
  else{e=T.match(new RegExp(k+'[^\\d]{0,40}(\\d{1,2})[\\/.\\-](\\d{4})','i'));if(e){const last=new Date(+e[2],+e[1],0).getDate();o.exp=isoD(last,e[1],e[2])}}
  return o;
}

    const dp=dupCheck(F.sup||'',F.num||'',parseFloat(F.amt)||0,F.date||today());

// ---- avvisi, scadenze ----
const lastT=id=>{for(let i=S.temps.length-1;i>=0;i--)if(S.temps[i].u===id)return S.temps[i];return null};
const tOk=(u,t)=>(u.max==null||t<=u.max)&&(u.min==null||t>=u.min);
function alerts(){
  const A=[];
  S.fatture.filter(f=>f.amt-paid(f)>.01).forEach(f=>{const d=dleft(dueOf(f)),r=eur(f.amt-paid(f));
    if(d<0)A.push({k:'scad',l:'bad',t:`${f.sup} n. ${f.num}: scaduta da ${-d} g · ${r}`});
    else if(d<=7)A.push({k:'scad',l:d<=2?'bad':'warn',t:`${f.sup} n. ${f.num}: scade ${d===0?'oggi':d===1?'domani':'tra '+d+' g'} · ${r}`})});
  Object.entries(S.storico).forEach(([n,h])=>{if(h.length<2)return;const a=h[h.length-2],b=h[h.length-1],pc=(b.p-a.p)/a.p*100;
    if(a.p>0&&pc>=S.soglia&&dleft(b.d)>-60)A.push({k:'prezzo',l:'warn',t:`${n}: prezzo +${pc.toFixed(0)}% (${eur(a.p)} → ${eur(b.p)})${b.s?' · '+b.s:''}`})});
  S.units.forEach(u=>{const r=lastT(u.id);
    if(r&&!tOk(u,r.t))A.push({k:'temp',l:'bad',t:`${u.n}: ${r.t}°C fuori soglia (${hm(r.at)})${r.act?' · azione: '+r.act:''}`});
    if((!r||day(r.at)!==ld())&&new Date().getHours()>=10)A.push({k:'temp0',l:'warn',t:`${u.n}: temperatura di oggi da registrare`})});
  return A;
}
function vAvvisi(kinds){
  const A=alerts().filter(a=>!kinds||kinds.includes(a.k));if(!A.length)return '';
  return `<div class="card" style="border-color:var(--bad)"><h2><i class="fa-solid fa-bell"></i> Avvisi (${A.length})</h2>${A.slice(0,8).map(a=>`<div class="${a.l}" style="margin:4px 0"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(a.t)}</div>`).join('')}${A.length>8?`<div class="mut">… e altri ${A.length-8}</div>`:''}</div>`;
}
function notifyDue(){try{if(!('Notification' in window)||Notification.permission!=='granted'||S.nd===ld())return;const A=alerts().filter(a=>a.k==='scad'&&a.l==='bad');if(A.length){new Notification('Chef Control · pagamenti',{body:A.slice(0,3).map(a=>a.t).join('\n')});S.nd=ld();save()}}catch(e){}}
function icsOf(list){
  const z=s=>s.replace(/-/g,''),st0=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=list.map(f=>['BEGIN:VEVENT','UID:'+f.id+'@chefcontrol','DTSTAMP:'+st0,'DTSTART;VALUE=DATE:'+z(dueOf(f)),'SUMMARY:Pagare '+f.sup+' fatt. '+f.num+' '+eur(f.amt-paid(f)),'BEGIN:VALARM','TRIGGER:-P2D','ACTION:DISPLAY','DESCRIPTION:Pagamento in scadenza','END:VALARM','END:VEVENT'].join('\r\n'));
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Chef Control//IT'].concat(ev,['END:VCALENDAR']).join('\r\n');
}
function vScad(){
  const op=S.fatture.filter(f=>f.amt-paid(f)>.01).sort((a,b)=>dueOf(a).localeCompare(dueOf(b)));

  const perm=('Notification' in window)?Notification.permission:'no';
  return `<div class="card"><h2><i class="fa-solid fa-calendar-days"></i> Scadenziario pagamenti</h2><div class="tot bad"><span>Totale da pagare</span><span>${sum(op)}</span></div><div class="f" style="margin-top:8px"><button class="sm" data-a="ics" data-id="all" style="flex:1"><i class="fa-solid fa-calendar-plus"></i> Tutte nel calendario</button>${perm==='granted'?'<span class="mut" style="flex:1">🔔 Avvisi attivi quando apri l’app</span>':perm==='no'?'':'<button class="sm" data-a="notif" style="flex:1"><i class="fa-solid fa-bell"></i> Attiva avvisi</button>'}</div><p class="mut">Il calendario del telefono ricorda la scadenza 2 giorni prima. Gli avvisi dell’app compaiono solo quando la apri.</p></div>`
  +g('Scadute',op.filter(f=>dleft(dueOf(f))<0),'bad')+g('Entro 7 giorni',op.filter(f=>{const d=dleft(dueOf(f));return d>=0&&d<=7}),'warn')+g('Più avanti',op.filter(f=>dleft(dueOf(f))>7),'')
  +(op.length?'':'<div class="card"><div class="empty">Nessun pagamento in sospeso 🎉</div></div>');
}

const WHY=['Scaduto','Avanzo / scarto di lavorazione','Caduto o rotto','Cottura errata','Rientro temperatura','Altro'];

  const it=find(n),val=q*pr(n);let rest=q;
  (l?[l]:S.lotti.filter(x=>x.name===n&&x.rem>0).sort((a,b)=>(a.exp||'9').localeCompare(b.exp||'9'))).forEach(x=>{const t=Math.min(x.rem,rest);if(t>0){x.rem=+(x.rem-t).toFixed(2);rest-=t}});
  S.mov.push({n,q,d:ld(),w:1});S.sprechi.push({id:uid(),at:new Date().toISOString(),d:ld(),n,q,u:it?it.u:'',why,by:S.who,val});
  lg('spreco',`${n} ${q} ${it?it.u:''} · ${why} · ${eur(val)}`,l?l.id:'');
}

async function scan(){
  const ov=document.getElementById('ov');ov.style.display='flex';
  ov.innerHTML='<button class="sm" data-a="close">✕ Chiudi</button><video id="vd" playsinline muted style="width:100%;border-radius:12px"></video><p id="sm" style="color:#fff;margin:0"></p><form data-f="manual" style="width:100%"><input name="c" placeholder="Codice a mano"><button class="sm">OK</button></form>';
  const sm=document.getElementById('sm'),vd=document.getElementById('vd');
  if(!('BarcodeDetector' in window)){sm.textContent='Scanner non supportato da questo browser: scrivi il codice a mano o usa la foto.';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vd.srcObject=stream;await vd.play();
    const det=new BarcodeDetector();(async function t(){if(!stream)return;const r=await det.detect(vd).catch(()=>[]);if(r.length){gotCode(r[0].rawValue);return}requestAnimationFrame(t)})();
  }catch(e){sm.textContent='Fotocamera non disponibile: controlla i permessi o scrivi il codice a mano.'}
}
function closeOv(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const o=document.getElementById('ov');o.style.display='none';o.innerHTML=''}

document.addEventListener('click',async e=>{

  const a=b.dataset.a,id=b.dataset.id,c=b.dataset.c;

  if(a==='ph'){e.preventDefault();const f=await phGet(id);if(!f){toast('Foto non trovata');return}const o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<button class="sm" data-a="close">✕ Chiudi</button>';const im=new Image();im.src=URL.createObjectURL(f);o.appendChild(im);return}

  if(a==='pick'){document.getElementById(id).click();return}
  if(a==='role')S.role=id;
  else if(a==='tab')S.tab=id;
  else if(a==='cat'){P[c].cat=id}
  else if(a==='sel'){P[c].sel=id}

  else if(a==='newit'){S.custom.push({n:id,u:'pz',c:'alimentare'});P[c].sel=id;P[c].q=''}
  else if(a==='qm')P.s.qty=Math.max(1,P.s.qty-1);
  else if(a==='qp')P.s.qty++;
  else if(a==='addsp'){const it=find(P.s.sel);if(!it)return;addSpesa(it.n,P.s.qty,it.u);toast(it.n+' aggiunto ✓');P.s.sel=null;P.s.qty=1;P.s.q=''}
  else if(a==='tg'){const i=S.spesa.find(x=>x.id===id);i.done=!i.done}
  else if(a==='cl')S.spesa=S.spesa.filter(i=>!i.done);
  else if(a==='cp'){const t=S.spesa.filter(i=>!i.done).map(i=>`- ${i.name}: ${i.qty} ${i.unit}`).join('\n');try{await navigator.clipboard.writeText('Lista della spesa\n'+t);toast('Lista copiata ✓')}catch(x){toast('Copia non disponibile')}return}
  else if(a==='sc'||a==='ex'){const l=S.lotti.find(x=>x.id===id);doScarico(l,a==='ex'?l.rem:parseFloat(document.getElementById('q'+id).value),a==='ex')}
  else if(a==='mode')M.F.mode=id;
  else if(a==='ro')P.o=P.o===id?null:id;
  else if(a==='ri'){S.ricette.find(x=>x.id===id).items.splice(+b.dataset.k,1)}
  else if(a==='rai'){const r=S.ricette.find(x=>x.id===id),it=find(P.r.sel),q=parseFloat(M.R.q);if(!it||!(q>0)){toast('Scegli ingrediente e quantità');return}const e=r.items.find(x=>x.n===it.n);if(e)e.q=q;else r.items.push({n:it.n,u:it.u,q});P.r.sel=null;P.r.q='';M.R.q=''}
  else if(a==='rdel'){if(confirm('Eliminare il piatto?')){S.ricette=S.ricette.filter(x=>x.id!==id);P.o=null}}
  else if(a==='aun')P.a.sel=null;
  else if(a==='alt'){const n=P.a.sel,o=Object.assign({},alOf(n)),cu=o[id];if(!cu)o[id]='c';else if(cu==='c')o[id]='t';else delete o[id];S.al[n]=o}
  else if(a==='print'){window.print();return}
  else if(a==='who')modal(whoForm());
  else if(a==='zoom'){const o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<button class="sm" data-a="close">✕ Chiudi</button>';const im=new Image();im.src=b.src;o.appendChild(im);return}
  else if(a==='fdel'){if(confirm('Eliminare questa fattura?')){const f=S.fatture.find(x=>x.id===id);S.fatture=S.fatture.filter(x=>x.id!==id);lg('fattura','Eliminata fattura '+f.sup+' n. '+f.num+' ('+eur(f.amt)+')')}}
  else if(a==='ics'){const l=id==='all'?S.fatture.filter(f=>f.amt-paid(f)>.01):[S.fatture.find(x=>x.id===id)];dl('scadenze-chef-control.ics',icsOf(l),'text/calendar');return}
  else if(a==='notif'){try{Notification.requestPermission().then(()=>render())}catch(x){}return}
  else if(a==='xdel')S.costi=S.costi.filter(x=>x.id!==id);
  else if(a==='udel'){if(confirm('Rimuovere questa unità?'))S.units=S.units.filter(x=>x.id!==id)}
  else if(a==='clok'){const t=S.ctasks.find(x=>x.id===id);S.clog.push({id:uid(),t:id,n:t?t.n:'',at:new Date().toISOString(),by:S.who});lg('pulizia',(t?t.n:'')+' eseguita')}
  else if(a==='ctdel')S.ctasks=S.ctasks.filter(x=>x.id!==id);
  else if(a==='nt'){const n=S.notes.find(x=>x.id===id);n.done=!n.done}
  else if(a==='ndel')S.notes=S.notes.filter(x=>x.id!==id);
  else if(a==='mdel')S.msgs=S.msgs.filter(x=>x.id!==id);
  else if(a==='mwa'){const t=(document.querySelector('textarea[name=t]')||{}).value||'';window.open('https://wa.me/?text='+encodeURIComponent('Chef Control · '+(S.who||'')+': '+t),'_blank');return}
  else if(a==='etm')modal(etichForm());
  else if(a==='lbl'){const l=S.lotti.find(x=>x.id===id);modal(lblModal(l));bcDraw(document.getElementById('md'))}
  else if(a==='prn'){const l=S.lotti.find(x=>x.id===id);printLabels(l,Math.max(1,Math.min(60,+document.getElementById('ncp').value||1)));return}
  else if(a==='msc'||a==='mex'){const l=S.lotti.find(x=>x.id===id);doScarico(l,a==='mex'?l.rem:parseFloat(document.getElementById('mq').value),a==='mex');closeMd()}
  else if(a==='mspr'){const l=S.lotti.find(x=>x.id===id),q=parseFloat(document.getElementById('mq').value)||l.rem;spreco(l.name,Math.min(q,l.rem),document.getElementById('mr').value,l);closeMd()}
  else if(a==='regcsv'){dl('registro-haccp.csv',toCsv([['Data e ora','Persona','Tipo','Dettaglio','Rif.']].concat(S.log.map(e=>[dh(e.at),e.by,e.k,e.t,e.ref]))));return}
  else if(a==='xls'||a==='csvf'||a==='csvi'){const m=P.m||ld().slice(0,7),d=monthData(m);if(a==='xls')dl('chef-control-'+m+'.xls',xlsOf([['Incassi',d.inc],['Fatture',d.fat],['Altri costi',d.cos],['Riepilogo',d.rie]]),'application/vnd.ms-excel');else dl((a==='csvf'?'fatture-':'incassi-')+m+'.csv',toCsv(a==='csvf'?d.fat:d.inc));return}
  else if(a==='unlock')modal(pinForm());
  else if(a==='chpin')modal(pinForm('new'));
  else if(a==='lock'){S.role='dip'}
  else if(a==='guide')modal(guide());
  else if(a==='closemd')closeMd();
  else if(a==='addp')modal(prodForm());
  else if(a==='inst'){if(DIP){DIP.prompt();DIP=null}}
  else if(a==='sub')P.sub[c]=id;
  else if(a==='mm'){const[y,mo]=P.m.split('-').map(Number),d=new Date(y,mo-1+(+id),1);P.m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  else if(a==='idel')S.inc=S.inc.filter(r=>r.id!==id);
  else if(a==='cv'){if(S.chk.d!==ld())S.chk={d:ld(),ids:[]};const i=S.chk.ids.indexOf(id);if(i<0){S.chk.ids.push(id);const l=S.lotti.find(x=>x.id===id);lg('check-in','Verificato '+(l?l.name+' · lotto '+l.lot:''),id)}else S.chk.ids.splice(i,1)}
  else if(a==='cdel'){e.preventDefault();if(S.cats.length<2||S.lotti.some(l=>l.rem>0&&catOf(l)===id)){toast('Categoria con prodotti o ultima rimasta: non si può togliere');return}S.cats=S.cats.filter(x=>x!==id)}
  else if(a==='bk'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),el=document.createElement('a');el.href=u;el.download='chef-control-backup-'+ld()+'.json';el.click();return}
  else if(a==='fall'){SUG.forEach(x=>addSpesa(x.n,x.buy,x.u));toast(SUG.length+' articoli aggiunti alla lista spesa ✓')}
  else if(a==='ord'){const t='Buongiorno, vorrei ordinare:\n'+SUG.filter(x=>x.sup===id).map(x=>`- ${x.n}: ${x.buy} ${x.u}`).join('\n')+'\nGrazie';try{await navigator.clipboard.writeText(t);toast('Ordine copiato ✓')}catch(x){toast('Copia non disponibile')}return}
  else if(a==='pay'||a==='full'){const f=S.fatture.find(x=>x.id===id),r=f.amt-paid(f);const q=a==='full'?r:Math.min(r,parseFloat(document.getElementById('p'+id).value));if(!(q>0))return;f.pays.push({amt:+q.toFixed(2),date:today(),kind:'pagamento'})}
  save();render();
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.b){const[o,k]=t.dataset.b.split('.');M[o][k]=t.value}
  if(t.dataset.b&&t.dataset.b[0]==='F'){if(M.F.auto)(M.F.touched=M.F.touched||{})[t.dataset.b.slice(2)]=1;const e=document.getElementById('fsum');if(e)e.innerHTML=fsumHTML()}
  if(t.dataset.rf){P.rf=t.value;const r=document.getElementById('rtab');if(r)r.innerHTML=regRows()}
  if(t.dataset.ln){const[i,k]=t.dataset.ln.split('.'),l=M.F.lines[i];l[k]=t.value;if(k==='n'||k==='u'){const a=autoFactor(l);l.f=a==null?'':String(a)}}
  if(t.dataset.key){try{localStorage.setItem(AIK[prov()],t.value.trim())}catch(x){}}
  if(t.dataset.b&&t.dataset.b[0]==='I'){const e=document.getElementById('itot');if(e)e.textContent=eur((+M.I.cash||0)+(+M.I.pos||0))}
  if(t.dataset.cq){const l=S.lotti.find(x=>x.id===t.dataset.cq);if(l){l.rem=Math.max(0,+t.value||0);l.qty=Math.max(l.qty,l.rem);save()}}
  if(t.name==='n'&&t.form&&t.form.dataset.f==='prod'){const it=find(t.value.trim().toLowerCase());if(it){t.form.c.value=catOfName(it.n);if(UL[it.u])t.form.u.value=UL[it.u]}}
  if(t.dataset.g){S[t.dataset.g]=+t.value||0;save()}
  if(t.dataset.pr){S.prezzi[t.dataset.pr]={p:+t.value||0,d:today()};save()}
  if(t.dataset.pq){P[t.dataset.pq].q=t.value;document.getElementById('g-'+t.dataset.pq).innerHTML=grid(t.dataset.pq)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.fi){FILE[t.dataset.fi]=t.files[0]||null;render()}
  if(t.dataset.xml&&t.files[0])parseXml(t.files[0]);
  if(t.dataset.prov){try{localStorage.setItem(PK,t.value)}catch(x){}render()}
  if(t.dataset.ck)M.F[t.dataset.ck]=t.checked;
  if(t.dataset.scan&&t.files[0])scanInvoice(t.files[0]);
  if(t.dataset.rest&&t.files[0])restore(t.files[0]);
  if(t.dataset.fi==='L'&&t.files[0])readLabel(t.files[0]);
  if(t.dataset.ln||t.dataset.g||t.dataset.pr)render();
  if(t.dataset.ch){P.c=t.value;render()}});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target,k=f.dataset.f,v=Object.fromEntries(new FormData(f));
  if(k==='manual'){gotCode((v.c||'').trim());return}
  if(['lotto','prod','temp','spr','etich','fatt'].includes(k)&&needWho())return;
  if(k==='who'){S.who=(v.w||'').trim();lg('accesso','Operatore: '+S.who);closeMd()}
  if(k==='temp'){const u=S.units.find(x=>x.id===v.u),t=parseFloat(v.t);if(!u||isNaN(t))return;const ok=tOk(u,t),act=(v.a||'').trim();if(!ok&&!act){toast('Temperatura fuori soglia: scrivi l’azione correttiva');return}S.temps.push({id:uid(),u:u.id,t,at:new Date().toISOString(),by:S.who,ok,act});lg('temperatura',u.n+': '+t+'°C'+(ok?'':' FUORI SOGLIA · '+act));toast(ok?'Temperatura registrata ✓':'⚠️ Registrata fuori soglia')}
  if(k==='unit'){S.units.push({id:uid(),n:v.n.trim(),max:parseFloat(v.max),min:v.min===''||v.min==null?null:parseFloat(v.min)})}
  if(k==='ctask'){S.ctasks.push({id:uid(),n:v.n.trim()})}
  if(k==='spr'){const n=v.n.trim().toLowerCase(),q=parseFloat(v.q);if(!n||!(q>0))return;spreco(n,q,v.w,null);toast('Spreco registrato: '+eur(q*pr(n)))}
  if(k==='note'){S.notes.unshift({id:uid(),t:v.t.trim(),by:S.who,at:new Date().toISOString(),done:false})}
  if(k==='msg'){S.msgs.push({id:uid(),t:v.t.trim(),by:S.who,r:S.role,at:new Date().toISOString()});toast('Messaggio pubblicato')}
  if(k==='costo'){const K=M.K;S.costi.push({id:uid(),date:K.date||ld(),cat:K.cat||COSTCAT[0],d:(K.d||'').trim(),amt:parseFloat(K.amt)});lg('costo','Costo '+(K.cat||COSTCAT[0])+': '+eur(parseFloat(K.amt)));M.K={}}
  if(k==='etich'){
    const n=v.n.trim().toLowerCase(),q=parseFloat(v.q),g=parseInt(v.g)||3,cp=Math.max(1,Math.min(60,parseInt(v.c)||1));if(!n||!(q>0))return;
    const cnt=S.lotti.filter(x=>x.prep&&x.pd===ld()).length+1,code='PR'+ld().replace(/-/g,'').slice(2)+'-'+String(cnt).padStart(2,'0');
    const rc=S.ricette.find(r=>r.n===n),al2=(v.a||'').trim()||(rc?Object.keys(rAl(rc)).map(i=>AL[i]).join(', '):'');
    const l={id:uid(),name:n,cat:S.cats.includes('Alimentari Freschi')?'Alimentari Freschi':S.cats[0],lot:code,bc:code,exp:addDays(ld(),g),qty:q,rem:q,unit:v.u,sup:'',ph:false,prep:1,pd:ld(),sto:v.s,all:al2,by:S.who};
    S.lotti.push(l);lg('preparazione','Preparato '+q+' '+v.u+' '+n+' · lotto '+code+' · scad. '+fd(l.exp),l.id);
    closeMd();modal(lblModal(l));bcDraw(document.getElementById('md'));setTimeout(()=>{const x=document.getElementById('ncp');if(x)x.value=cp},0);
  }
  if(k==='pin'){
    const has=getPin()&&f.dataset.mode!=='new';
    if(!has){if(!/^\d{4,8}$/.test(v.p1||'')||v.p1!==v.p2){toast('Il PIN deve avere 4-8 cifre, uguali nei due campi');return}try{localStorage.setItem(PINK,await sha(v.p1))}catch(x){}toast('PIN impostato ✓')}
    else if(await sha(v.p1||'')!==getPin()){toast('PIN errato');return}
    S.role='tit';LT=Date.now();lg('accesso','Sblocco area titolare');closeMd();
  }
  if(k==='prod'){
    const n=v.n.trim().toLowerCase(),q=parseFloat(v.q);if(!n||!(q>0))return;
    if(!find(n))S.custom.push({n,u:v.u,c:'alimentare'});
    const id=uid();S.lotti.push({id,name:n,cat:v.c,lot:v.l.trim(),exp:v.e||'',qty:q,rem:q,unit:v.u,sup:'',ph:false});
    if(S.chk.d!==ld())S.chk={d:ld(),ids:[]};lg('arrivo','Aggiunto al check-in: '+q+' '+v.u+' '+n+' · lotto '+v.l.trim(),id);S.chk.ids.push(id);P.sub.cuc='chk';closeMd();toast(n+' aggiunto al check-in ✓');
  }
  if(k==='cat'){const c=(M.C.n||'').trim();if(c&&!S.cats.includes(c))S.cats.push(c);M.C={}}
  if(k==='inc'){const I=M.I,d=I.date||ld(),cash=+I.cash||0,pos=+I.pos||0;if(cash+pos<=0){toast('Inserisci almeno un importo');return}const ex=S.inc.find(r=>r.date===d);if(ex){ex.cash=cash;ex.pos=pos}else S.inc.push({id:uid(),date:d,cash,pos});lg('incasso','Incasso '+fd(d)+': contanti '+eur(cash)+', POS '+eur(pos));M.I={};P.m=d.slice(0,7);toast('Incasso del '+fd(d)+' registrato ✓')}
  if(k==='lotto'){
    const it=find(P.l.sel);if(!it){toast('Scegli prima l’articolo dal catalogo');return}
    const L=M.L,id=uid(),q=parseFloat(L.qty);let ph=false;
    if(FILE.L)ph=await phPut(id,await shrink(FILE.L));
    S.lotti.push({id,name:it.n,lot:(L.lot||'').trim(),exp:L.exp,qty:q,rem:q,unit:it.u,sup:(L.sup||'').trim(),ph});
    lg('arrivo','Arrivo '+q+' '+it.u+' '+it.n+' · lotto '+(L.lot||'').trim()+((L.sup||'').trim()?' · '+(L.sup||'').trim():''),id);
    if(L.code)S.barcodes[L.code]=it.n;
    M.L={};FILE.L=null;P.l.sel=null;P.l.q='';toast('Lotto registrato ✓');
  }
  if(k==='fatt'){
    const F=M.F,id=uid(),amt=parseFloat(F.amt),sup=(F.sup||'').trim(),num=(F.num||'').trim(),date=F.date||today();
    const dp=dupCheck(sup,num,amt,date);
    if(dp&&dp.k==='exact'){toast('Fattura già registrata il '+fd(dp.f.date)+' ('+eur(dp.f.amt)+'): non la salvo due volte');return}
    if(dp&&dp.k==='sim'&&!confirm('Esiste già una fattura di '+sup+' con stesso importo e data (n. '+dp.f.num+'). Salvare comunque?'))return;
    if((F.auto==='ocr'||F.auto==='ai')&&!F.ok){toast('Prima di salvare spunta “Ho controllato i dati con la fattura”');return}
    const bad=(F.lines||[]).find(l=>l.n&&!(parseFloat(l.f)>0));
    if(bad){toast('Riga “'+String(bad.d).slice(0,30)+'”: indica quanti '+((find(bad.n)||{}).u||'')+' contiene l’unità di fattura');return}
    const cc=fcalc(),iva=+cc.iva.toFixed(2),imp=+(amt-iva).toFixed(2);
    const L=(F.lines||[]).map(l=>{const f=l.n?parseFloat(l.f):1;return Object.assign({},l,{qn:(+l.q)*f,pn:(+l.p)/f})});
    const sumL=(F.lines||[]).reduce((a,l)=>a+(+l.q)*(+l.p),0);
    if(L.length&&Math.abs(sumL-imp)>Math.max(1,imp*.02)&&!confirm('Le righe sommano '+eur(sumL)+' ma l’imponibile è '+eur(imp)+'. Salvare comunque?'))return;
    let ph=false;if(FILE.F)ph=await phPut(id,await shrink(FILE.F));
    const inv={id,sup,num,amt,imp,iva,date,due:F.due||addDays(date,S.gg),pays:[],ph,src:F.auto||'manuale'};
    let need=amt;
    S.acconti=S.acconti.filter(a=>{
      if(a.sup.toLowerCase()!==sup.toLowerCase()||need<=0)return true;
      const t=Math.min(a.amt,need);inv.pays.push({amt:t,date:a.date,kind:'acconto'});need-=t;a.amt=+(a.amt-t).toFixed(2);return a.amt>0.001;
    });
    const res=amt-paid(inv);
    if(F.mode==='pagato'&&res>0)inv.pays.push({amt:+res.toFixed(2),date:today(),kind:'pagamento'});
    if(F.mode==='parziale'){const p=Math.min(parseFloat(F.part||0),res);if(p>0)inv.pays.push({amt:p,date:today(),kind:'pagamento'})}
    L.forEach(l=>{if(l.n&&l.pn>0){const pv=+l.pn.toFixed(4);S.prezzi[l.n]={p:pv,d:date};(S.storico[l.n]=S.storico[l.n]||[]).push({p:pv,d:date,s:sup})}});
    if(F.loadlots!==false)L.forEach(l=>{if(l.n&&l.lot&&l.qn>0){const it=find(l.n),lid=uid();S.lotti.push({id:lid,name:l.n,lot:l.lot,exp:'',qty:+l.qn.toFixed(3),rem:+l.qn.toFixed(3),unit:it?it.u:'',sup,ph:false,by:S.who});lg('arrivo','Arrivo da fattura: '+l.qn.toFixed(2)+' '+(it?it.u:'')+' '+l.n+' · lotto '+l.lot+' · '+sup,lid)}});
    S.fatture.push(inv);lg('fattura','Fattura '+sup+' n. '+num+' · '+eur(amt)+' · '+inv.src);
    M.F={mode:'in_debito'};FILE.F=null;toast('Fattura salvata ✓');
  }
  if(k==='ric'){S.ricette.push({id:uid(),n:M.R.n.trim().toLowerCase(),price:parseFloat(M.R.p||0),por:parseFloat(M.R.por||1),items:[]});M.R={};toast('Piatto creato ✓')}
  if(k==='acc'){S.acconti.push({id:uid(),sup:M.A.sup.trim(),amt:parseFloat(M.A.amt),date:today()});M.A={};toast('Acconto registrato ✓')}
  save();render();
});
window.addEventListener('storage',e=>{if(e.key===K){try{S=JSON.parse(e.newValue);render()}catch(x){}}});
render();
</script>
